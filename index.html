    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Runtime constraint: HMR is disabled in this environment. Suppress harmless Vite client WebSocket disconnect/rejection warnings.
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var filename = event && event.filename ? event.filename : '';
        var msg = event && event.message ? event.message : '';
        if (filename.includes('@vite/client') || msg.includes('WebSocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>

  </body>
